name: Rational arithmetic witness evidence

on:
  pull_request:
    paths:
      - 'klause-bench/exact-projection/**'
      - '.github/workflows/rational-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  witnesses:
    name: Independently check recorded MPS witnesses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Regenerate archived lab summaries
        shell: bash
        run: |
          for job in 865 866 867; do
            gzip -dc "klause-bench/exact-projection/raw/job-$job-cases.json.gz" > "$RUNNER_TEMP/job-$job-cases.json"
          done
          python3 klause-bench/exact-projection/compare.py "$RUNNER_TEMP/job-865-cases.json" > work-summary.json
          cmp work-summary.json klause-bench/exact-projection/fixed-work-summary.json
          for job in 866 867; do
            python3 klause-bench/exact-projection/summarize.py "$RUNNER_TEMP/job-$job-cases.json" "$RUNNER_TEMP/job-$job"
            cmp "$RUNNER_TEMP/job-$job-summary.json" "klause-bench/exact-projection/job-$job-summary.json"
            cmp "$RUNNER_TEMP/job-$job-provenance.json" "klause-bench/exact-projection/job-$job-provenance.json"
          done
          python3 klause-bench/exact-projection/check_archive.py
      - name: Check original MPS rows, bounds and integer markers
        run: python3 klause-bench/exact-projection/check_witnesses.py klause-bench/exact-projection/witness-evidence.json > witness-checks.json
      - name: Upload independent checks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rational-witness-checks
          path: |
            witness-checks.json
            work-summary.json
