name: presolve report

on:
  pull_request:
    paths:
      - 'klause-bench/campaigns/presolve-554/**'
      - '.github/workflows/presolve-report.yml'
  workflow_dispatch:

concurrency:
  group: presolve-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Validate archived AWS presolve reports
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Analyze archived records
        env:
          PRESOLVE_REPORT_DIR: ${{ runner.temp }}/presolve-reports
        run: |
          mkdir -p "$PRESOLVE_REPORT_DIR"
          cd klause-bench/campaigns/presolve-554
          python3 analyze.py evidence/863/final-cases.json.gz > "$PRESOLVE_REPORT_DIR/863.json"
          python3 analyze.py evidence/874/final-cases.json.gz > "$PRESOLVE_REPORT_DIR/874.json"
          python3 analyze.py evidence/876/final-cases.json.gz --control default-one > "$PRESOLVE_REPORT_DIR/876.json"
          python3 analyze.py evidence/892/cases.json.gz --control default > "$PRESOLVE_REPORT_DIR/892.json"
          python3 analyze.py evidence/903/cases.json.gz --control default > "$PRESOLVE_REPORT_DIR/903.json"
          python3 analyze.py evidence/906/partial-cases.json.gz --control default > "$PRESOLVE_REPORT_DIR/906-partial.json"
          python3 analyze.py evidence/906/final-cases.json.gz --control default > "$PRESOLVE_REPORT_DIR/906.json"
          python3 analyze.py evidence/907/partial-cases.json.gz --control default > "$PRESOLVE_REPORT_DIR/907-partial.json"
          python3 analyze.py evidence/907/final-cases.json.gz --control default > "$PRESOLVE_REPORT_DIR/907.json"
          python3 analyze.py evidence/914/final-cases.json.gz --control default > "$PRESOLVE_REPORT_DIR/914.json"
      - name: Summarize separate AWS recording
        env:
          PRESOLVE_REPORT_DIR: ${{ runner.temp }}/presolve-reports
          PRESOLVE_PROFILE_DIR: ${{ runner.temp }}/presolve-profile
        run: |
          mkdir -p "$PRESOLVE_PROFILE_DIR"
          cp -R klause-bench/campaigns/presolve-554/evidence/911/cases "$PRESOLVE_PROFILE_DIR/"
          find "$PRESOLVE_PROFILE_DIR" -name '*.gz' -exec gzip -d {} +
          python3 klause-bench/exact-projection/profile.py "$PRESOLVE_PROFILE_DIR" > "$PRESOLVE_REPORT_DIR/911-profile.json"
          python3 klause-bench/campaigns/presolve-554/profile_windows.py "$PRESOLVE_PROFILE_DIR" > "$PRESOLVE_REPORT_DIR/911-windows.json"
      - uses: actions/upload-artifact@v7
        with:
          name: presolve-reports
          path: ${{ runner.temp }}/presolve-reports
          if-no-files-found: error
