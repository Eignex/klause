name: presolve report

on:
  pull_request:
    paths:
      - 'klause-bench/campaigns/presolve-554/**'
      - '.github/workflows/presolve-report.yml'
  workflow_dispatch:

concurrency:
  group: presolve-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Validate archived AWS presolve reports
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Analyze archived records
        env:
          PRESOLVE_REPORT_DIR: ${{ runner.temp }}/presolve-reports
        run: |
          mkdir -p "$PRESOLVE_REPORT_DIR"
          cd klause-bench/campaigns/presolve-554
          python3 analyze.py evidence/863/final-cases.json.gz > "$PRESOLVE_REPORT_DIR/863.json"
          python3 analyze.py evidence/874/final-cases.json.gz > "$PRESOLVE_REPORT_DIR/874.json"
          python3 analyze.py evidence/876/final-cases.json.gz --control default-one > "$PRESOLVE_REPORT_DIR/876.json"
          python3 analyze.py evidence/892/cases.json.gz --control default > "$PRESOLVE_REPORT_DIR/892.json"
      - uses: actions/upload-artifact@v7
        with:
          name: presolve-reports
          path: ${{ runner.temp }}/presolve-reports
          if-no-files-found: error
