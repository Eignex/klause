name: RWS conflict evidence

on:
  pull_request:
    paths:
      - 'klause-bench/rws-conflict/**'
      - '.github/workflows/rws-evidence.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Audit frozen AWS records
        shell: bash
        run: |
          set -euo pipefail
          directory=klause-bench/rws-conflict
          mkdir -p build/rws-evidence
          for cases in "$directory"/*-cases.json; do
            prefix=${cases%-cases.json}
            python3 "$directory/summarize.py" "$prefix-lab.json" "$cases" \
              "$prefix-arms.json" "$prefix-job.json" "build/rws-evidence/$(basename "$prefix")-results.json"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: rws-evidence-audit
          path: build/rws-evidence/
