name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# A newer push supersedes any in-flight run for the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run JVM tests and collect coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python for source checker tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Test independent source checkers
        run: |
          python3 -m pip install -r klause-bench/tools/requirements-source-checks.txt
          python3 -m unittest discover -s klause-bench/tools -p 'test_verify*source_results.py'

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Gradle caches are scoped to each branch and main; every branch may write.
      # The encryption key enables configuration-cache persistence.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      # Default target set is host-only (jvm + linuxX64); the cross-compiled native targets
      # (linuxArm64, macosArm64) are opt-in via -Ptargets.full and build on release.

      # Lint runs separately. Native tests have their own job because Kover instruments JVM tests.
      - name: Run JVM tests with coverage
        run: ./gradlew --refresh-dependencies check -x :klause:linuxX64Test -x :klause-cli:linuxX64Test koverXmlReport :klause-cli:installJvmDist

      - name: Start the installed JVM CLI
        run: klause-cli/build/install/klause-cli-jvm/bin/klause-cli --version

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            klause/build/reports/tests/
            klause/build/test-results/
            klause-cli/build/reports/tests/
            klause-cli/build/test-results/
            klause-bench/build/reports/tests/
            klause-bench/build/test-results/
          if-no-files-found: ignore

      - name: Upload results to Codecov (main only)
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: klause/build/reports/kover/report.xml
          fail_ci_if_error: false

  native-test:
    name: Run Linux native tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Run Linux native tests
        run: ./gradlew --refresh-dependencies :klause:linuxX64Test :klause-cli:linkReleaseExecutableLinuxX64

      - name: Start the Linux native CLI
        run: klause-cli/build/bin/linuxX64/releaseExecutable/klause-cli.kexe --version

      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-reports
          path: |
            klause/build/reports/tests/
            klause/build/test-results/
            klause-cli/build/reports/tests/
            klause-cli/build/test-results/
          if-no-files-found: ignore

  # Detekt and Dokka link validation run in parallel with tests.
  lint:
    name: Lint and validate docs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Run linter
        run: ./gradlew --refresh-dependencies lintDocs

      - name: Show linter source changes
        if: failure()
        run: git diff -- '*.kt'
