name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A newer push supersedes any in-flight run for the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Persists the Gradle home (dependencies AND the local build cache) across runs, so
      # unchanged modules' compile, detekt and test tasks come back FROM-CACHE instead of
      # re-executing. Every branch writes its own entries — GitHub scopes them (a branch
      # reads its own entries plus main's), so repeated pushes to a PR hit the cache even
      # before anything lands on main.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # Yuck is not on Maven Central; :klause-yuck:installYuck downloads the pinned release
      # zip into ~/.cache/klause-yuck on first use. Cache it so CI doesn't re-download
      # (the key tracks the pinned version via the module build script hash).
      - name: Cache Yuck distribution
        uses: actions/cache@v4
        with:
          path: ~/.cache/klause-yuck
          key: ${{ runner.os }}-yuck-${{ hashFiles('klause-yuck/build.gradle.kts') }}

      # PR/main builds compile and test only the host-executable targets (jvm + linuxX64,
      # -Ptargets.hostOnly); the full matrix — apple, windows, js, wasm and their browser/
      # node test runtimes (pinned Chrome, userns sandbox, bounded workers; #171) — runs on
      # release via release.yml.

      # Repo-wide detekt (kumulant runs lintDocs here; klause's dokka half is blocked on a
      # backlog of unresolved KDoc links — see the tracking issue).
      - name: Run linter
        run: ./gradlew detekt -Ptargets.hostOnly

      - name: Assemble
        run: ./gradlew assemble -Ptargets.hostOnly

      - name: Run build and tests with coverage
        run: ./gradlew build koverXmlReport -Ptargets.hostOnly

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            klause/build/reports/tests/
            klause/build/test-results/
          if-no-files-found: ignore

      - name: Upload results to Codecov (main only)
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: klause/build/reports/kover/report.xml
          fail_ci_if_error: false
