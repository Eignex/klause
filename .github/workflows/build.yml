name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      native-cold-build:
        description: Disable the build cache for the Linux native job
        type: boolean
        default: false
      native-test-repeat:
        description: Number of Linux native suite iterations
        type: choice
        options: ['1', '5']
        default: '1'
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}

# A newer push supersedes any in-flight run for the same ref.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run JVM tests and collect coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Build jobs persist dependency and encrypted configuration caches.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties', '**/*.versions.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-konan-

      # Default target set is host-only (jvm + linuxX64); the cross-compiled native targets
      # (linuxArm64, macosArm64) are opt-in via -Ptargets.full and build on release.

      # Lint runs separately. Native tests have their own job because Kover instruments JVM tests.
      - name: Verify lab SDK caching and retry policy
        run: bash klause-bench/scripts/run-verified-gradle.sh -p buildSrc test

      - name: Run JVM tests with coverage
        run: bash klause-bench/scripts/run-verified-gradle.sh --refresh-dependencies check -x :klause:linuxX64Test -x :klause-cli:linuxX64Test koverXmlReport :klause-cli:installJvmDist :klause:stageLpProfileJvm

      - name: Start the installed JVM CLI
        run: klause-cli/build/install/klause-cli-jvm/bin/klause-cli --version

      - name: Verify Kotlin sources are unchanged
        if: always()
        run: git diff --exit-code -- '*.kt' '*.kts'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            klause/build/reports/tests/
            klause/build/test-results/
            klause/build/kotlin/abi/
            klause-cli/build/reports/tests/
            klause-cli/build/test-results/
            klause-bench/build/reports/tests/
            klause-bench/build/test-results/
            buildSrc/build/reports/tests/
            buildSrc/build/test-results/
          if-no-files-found: ignore

      - name: Upload results to Codecov (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: klause/build/reports/kover/report.xml
          fail_ci_if_error: false

  native-test:
    name: Run Linux native tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Install native debugger
        run: sudo apt-get update && sudo apt-get install --yes gdb

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties', '**/*.versions.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-konan-

      - name: Run Linux native tests
        timeout-minutes: 35
        shell: bash
        env:
          NATIVE_CACHE_OPTION: ${{ inputs.native-cold-build && '--no-build-cache' || '--build-cache' }}
          NATIVE_TEST_REPEAT: ${{ inputs.native-test-repeat || '1' }}
        run: |
          mkdir -p native-diagnostics
          native_runner=$$
          (
            for minute in {1..25}; do
              sleep 60
              kill -0 "$native_runner" 2>/dev/null || exit 0
              if (( minute % 5 == 0 )); then
                ps -eLo pid,ppid,tid,stat,pcpu,pmem,wchan:32,args > "native-diagnostics/processes-$minute.txt"
                free -h > "native-diagnostics/memory-$minute.txt"
              fi
            done
            df -h > native-diagnostics/disk.txt
            for pid in $(jcmd -l | awk '/GradleDaemon|KotlinCompileDaemon/ {print $1}'); do
              timeout 10s jcmd "$pid" Thread.print > "native-diagnostics/threads-$pid.txt" 2>&1 || true
            done
            for pid in $(pgrep -f '[/]debugTest/[^ ]+\.kexe'); do
              sudo timeout 30s gdb --batch -ex 'thread apply all bt' -p "$pid" > "native-diagnostics/native-threads-$pid.txt" 2>&1 || true
            done
          ) > native-diagnostics/watchdog.log 2>&1 &
          # Leave time for Gradle to flush partial reports and for the artifact upload.
          # The runner signals timeout directly so cancellation reaches Gradle's process group.
          exec timeout --signal=INT --kill-after=60s 30m bash klause/scripts/native-ci.sh > >(tee native-diagnostics/gradle.log) 2>&1

      - name: Start the Linux native CLI
        run: klause-cli/build/bin/linuxX64/releaseExecutable/klause-cli.kexe --version

      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-reports-${{ github.run_attempt }}
          path: |
            native-diagnostics/
            klause/build/reports/tests/
            klause/build/test-results/
            klause-cli/build/reports/tests/
            klause-cli/build/test-results/
          if-no-files-found: ignore

  # Detekt and Dokka link validation run in parallel with tests.
  lint:
    name: Lint and validate docs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties', '**/*.versions.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-konan-

      - name: Run linter
        run: ./gradlew --refresh-dependencies lintDocs

      - name: Verify Kotlin sources are unchanged
        if: always()
        run: git diff --exit-code -- '*.kt' '*.kts'
