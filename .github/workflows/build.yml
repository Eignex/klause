name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      payload:
        description: Externally staged evidence bundle
        required: false
        type: string
      mode:
        description: Evidence mode
        default: controls
        type: string

# A newer push supersedes any in-flight run for the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-evidence:
    if: github.event_name == 'workflow_dispatch' && inputs.payload != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Unpack evidence
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          python3 - <<'PY'
          import base64, io, os, pathlib, tarfile
          root = pathlib.Path('campaign')
          root.mkdir()
          with tarfile.open(fileobj=io.BytesIO(base64.b64decode(os.environ['PAYLOAD'])), mode='r:xz') as source:
              source.extractall(root, filter='data')
          PY
      - name: Check records and provenance
        env:
          MODE: ${{ inputs.mode }}
        run: python3 campaign/analyze.py campaign campaign/experiment.json campaign/result "$MODE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: external-campaign-evidence
          path: campaign/
          retention-days: 90
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.payload == ''
    name: Run JVM tests and collect coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Persists the Gradle home incl. the local build cache; every branch writes so
      # repeated PR pushes hit it (GitHub scopes entries to the branch plus main). The
      # encryption key additionally persists the configuration cache across runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      # Default target set is host-only (jvm + linuxX64); the cross-compiled native targets
      # (linuxArm64, macosArm64) are opt-in via -Ptargets.full and build on release.

      # `check` runs tests without lintDocs (detekt + dokka), which the parallel `lint` job
      # already covers. Keeping them separate avoids running lintDocs twice per push. Kover only
      # reports JVM coverage, so native tests run in their own job without its instrumentation.
      - name: Run JVM tests with coverage
        run: ./gradlew --refresh-dependencies check -x :klause:linuxX64Test -x :klause-cli:linuxX64Test koverXmlReport

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            klause/build/reports/tests/
            klause/build/test-results/
          if-no-files-found: ignore

      - name: Upload results to Codecov (main only)
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: klause/build/reports/kover/report.xml
          fail_ci_if_error: false

  native-test:
    if: github.event_name != 'workflow_dispatch' || inputs.payload == ''
    name: Run Linux native tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Run Linux native tests
        run: ./gradlew --refresh-dependencies :klause:linuxX64Test :klause-cli:linuxX64Test

      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-reports
          path: |
            klause/build/reports/tests/
            klause/build/test-results/
            klause-cli/build/reports/tests/
            klause-cli/build/test-results/
          if-no-files-found: ignore

  # Repo-wide lintDocs: detekt plus dokka with fail-on-warning, for KDoc-link validation
  # parity with the other modules. dokka's full doc generation is the slowest thing in CI,
  # so it runs as its own job — still a required check, but in parallel with `test` rather
  # than serially in front of it.
  lint:
    if: github.event_name != 'workflow_dispatch' || inputs.payload == ''
    name: Lint and validate docs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Run linter
        run: ./gradlew --refresh-dependencies lintDocs
