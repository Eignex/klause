name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

# A newer push supersedes any in-flight run for the same ref.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run JVM tests and collect coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Build jobs persist dependency and encrypted configuration caches.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties', '**/*.versions.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-konan-

      # Default target set is host-only (jvm + linuxX64); the cross-compiled native targets
      # (linuxArm64, macosArm64) are opt-in via -Ptargets.full and build on release.

      # Lint runs separately. Native tests have their own job because Kover instruments JVM tests.
      - name: Run JVM tests with coverage
        run: ./gradlew --refresh-dependencies check -x :klause:linuxX64Test -x :klause-cli:linuxX64Test koverXmlReport :klause-cli:installJvmDist

      - name: Start the installed JVM CLI
        run: klause-cli/build/install/klause-cli-jvm/bin/klause-cli --version

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            klause/build/reports/tests/
            klause/build/test-results/
            klause/build/kotlin/abi/
            klause-cli/build/reports/tests/
            klause-cli/build/test-results/
            klause-bench/build/reports/tests/
            klause-bench/build/test-results/
          if-no-files-found: ignore

      - name: Upload results to Codecov (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: klause/build/reports/kover/report.xml
          fail_ci_if_error: false

  native-test:
    name: Run Linux native tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties', '**/*.versions.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-konan-

      - name: Run Linux native tests
        run: ./gradlew --refresh-dependencies :klause:linuxX64Test :klause-cli:linkReleaseExecutableLinuxX64

      - name: Start the Linux native CLI
        run: klause-cli/build/bin/linuxX64/releaseExecutable/klause-cli.kexe --version

      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-reports
          path: |
            klause/build/reports/tests/
            klause/build/test-results/
            klause-cli/build/reports/tests/
            klause-cli/build/test-results/
          if-no-files-found: ignore

  # Detekt and Dokka link validation run in parallel with tests.
  lint:
    name: Lint and validate docs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties', '**/*.versions.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-konan-

      - name: Run linter
        run: ./gradlew --refresh-dependencies lintDocs

      - name: Show linter source changes
        if: failure()
        run: git diff -- '*.kt'
