name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A newer push supersedes any in-flight run for the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Persists the Gradle home (dependencies AND the local build cache) across runs:
      # main writes cache entries, PR runs read them, so unchanged modules' compile,
      # detekt and jvm test tasks come back FROM-CACHE instead of re-executing.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # Yuck is not on Maven Central; :klause-yuck:installYuck downloads the pinned release
      # zip into ~/.cache/klause-yuck on first use. Cache it so CI doesn't re-download
      # (the key tracks the pinned version via the module build script hash).
      - name: Cache Yuck distribution
        uses: actions/cache@v4
        with:
          path: ~/.cache/klause-yuck
          key: ${{ runner.os }}-yuck-${{ hashFiles('klause-yuck/build.gradle.kts') }}

      # Pin the karma browser to the Chrome for Testing build validated locally (#171):
      # the runner image's own Chrome drifts with image rollouts, and the wasm flake wave
      # correlated with an image update. CHROME_BIN is honored by karma-chrome-launcher.
      - name: Set up pinned Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 148.0.7778.178

      # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor, so a downloaded
      # Chrome binary (unlike the image's profiled preinstall) cannot create its sandbox
      # and aborts at launch with "No usable sandbox!". Re-enable userns so Chrome keeps
      # its sandbox — preferred over --no-sandbox per the chromium docs the error links.
      - name: Allow Chrome's sandbox (Ubuntu 24.04 userns restriction)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Repo-wide detekt (kumulant runs lintDocs here; klause's dokka half is blocked on a
      # backlog of unresolved KDoc links — see the tracking issue).
      - name: Run linter
        run: ./gradlew detekt

      # Compile at full parallelism first, then run the verification phase with bounded
      # workers: with the configuration cache Gradle executes test tasks in parallel, so
      # JVM test JVMs, ChromeHeadless and the node wasm runtimes otherwise compete for the
      # runner's cores — the load that starves/kills roughly one wasm test per run (#171).
      - name: Assemble
        run: ./gradlew assemble

      - name: Run build and tests with coverage
        run: ./gradlew build koverXmlReport --max-workers=2
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            klause/build/reports/tests/
            klause/build/test-results/
          if-no-files-found: ignore

      - name: Upload results to Codecov (main only)
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: klause/build/reports/kover/report.xml
          fail_ci_if_error: false
