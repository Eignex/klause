name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A newer push supersedes any in-flight run for the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Persists the Gradle home incl. the local build cache; every branch writes so
      # repeated PR pushes hit it (GitHub scopes entries to the branch plus main). The
      # encryption key additionally persists the configuration cache across runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # Yuck is not on Maven Central; :klause-yuck:installYuck downloads the pinned release
      # zip into ~/.cache/klause-yuck on first use. Cache it so CI doesn't re-download
      # (the key tracks the pinned version via the module build script hash).
      - name: Cache Yuck distribution
        uses: actions/cache@v5
        with:
          path: ~/.cache/klause-yuck
          key: ${{ runner.os }}-yuck-${{ hashFiles('klause-yuck/build.gradle.kts') }}

      # -Ptargets.hostOnly: only jvm + linuxX64 here; the full matrix (apple, windows,
      # js/wasm with their browser/node runtimes) builds and tests on release.

      # Repo-wide lintDocs: detekt plus dokka with fail-on-warning, for KDoc-link validation
      # parity with the other modules.
      - name: Run linter
        run: ./gradlew lintDocs -Ptargets.hostOnly

      - name: Assemble
        run: ./gradlew assemble -Ptargets.hostOnly

      - name: Run build and tests with coverage
        run: ./gradlew build koverXmlReport -Ptargets.hostOnly

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            klause/build/reports/tests/
            klause/build/test-results/
          if-no-files-found: ignore

      - name: Upload results to Codecov (main only)
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: klause/build/reports/kover/report.xml
          fail_ci_if_error: false
