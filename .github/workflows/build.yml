name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      lab_cases:
        description: Gzip-compressed lab cases in base64; empty runs the full gate
        type: string
        default: ''
      lab_control:
        description: Control label for paired lab record analysis
        type: string
        default: default

# A newer push supersedes any in-flight run for the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.lab_cases == ''
    name: Run JVM tests and collect coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Persists the Gradle home incl. the local build cache; every branch writes so
      # repeated PR pushes hit it (GitHub scopes entries to the branch plus main). The
      # encryption key additionally persists the configuration cache across runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      # Default target set is host-only (jvm + linuxX64); the cross-compiled native targets
      # (linuxArm64, macosArm64) are opt-in via -Ptargets.full and build on release.

      # `check` runs tests without lintDocs (detekt + dokka), which the parallel `lint` job
      # already covers. Keeping them separate avoids running lintDocs twice per push. Kover only
      # reports JVM coverage, so native tests run in their own job without its instrumentation.
      - name: Run JVM tests with coverage
        run: ./gradlew --refresh-dependencies check -x :klause:linuxX64Test -x :klause-cli:linuxX64Test koverXmlReport

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            klause/build/reports/tests/
            klause/build/test-results/
          if-no-files-found: ignore

      - name: Upload results to Codecov (main only)
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: klause/build/reports/kover/report.xml
          fail_ci_if_error: false

  native-test:
    if: github.event_name != 'workflow_dispatch' || inputs.lab_cases == ''
    name: Run Linux native tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Run Linux native tests
        run: ./gradlew --refresh-dependencies :klause:linuxX64Test :klause-cli:linuxX64Test

      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-reports
          path: |
            klause/build/reports/tests/
            klause/build/test-results/
            klause-cli/build/reports/tests/
            klause-cli/build/test-results/
          if-no-files-found: ignore

  # Repo-wide lintDocs: detekt plus dokka with fail-on-warning, for KDoc-link validation
  # parity with the other modules. dokka's full doc generation is the slowest thing in CI,
  # so it runs as its own job — still a required check, but in parallel with `test` rather
  # than serially in front of it.
  lint:
    if: github.event_name != 'workflow_dispatch' || inputs.lab_cases == ''
    name: Lint and validate docs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Run linter
        run: ./gradlew --refresh-dependencies lintDocs

  lab-evidence:
    name: Analyze supplied lab records
    if: github.event_name == 'workflow_dispatch' && inputs.lab_cases != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Analyze paired records
        env:
          LAB_CASES: ${{ inputs.lab_cases }}
          LAB_CONTROL: ${{ inputs.lab_control }}
        run: |
          printf '%s' "$LAB_CASES" | base64 --decode > "$RUNNER_TEMP/lab-cases.json.gz"
          python3 klause-bench/tools/analyze_lab.py "$RUNNER_TEMP/lab-cases.json.gz" --control "$LAB_CONTROL" > "$RUNNER_TEMP/lab-analysis.json"
      - uses: actions/upload-artifact@v7
        with:
          name: lab-evidence
          path: |
            ${{ runner.temp }}/lab-cases.json.gz
            ${{ runner.temp }}/lab-analysis.json
          if-no-files-found: error
