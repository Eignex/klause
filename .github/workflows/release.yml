name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Extract Version
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      # The full matrix runs the browser tests, so pin Chrome and enable its sandbox; the
      # runner image's own Chrome drifts with image rollouts.
      - name: Set up pinned Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 148.0.7778.178

      - name: Allow Chrome's sandbox (Ubuntu 24.04 userns restriction)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Assemble
        run: ./gradlew --no-daemon assemble -PciVersion=${{ env.RELEASE_VERSION }}

      - name: Build and Test
        run: ./gradlew --no-daemon build -PciVersion=${{ env.RELEASE_VERSION }} --max-workers=2
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            klause/build/reports/tests/
            klause/build/test-results/
          if-no-files-found: ignore

      # Library publishing is not enabled yet; re-enable when klause publishes to Central.
      # - name: Publish to Maven Central (Portal)
      #   env:
      #     ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
      #     ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
      #     ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
      #     ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
      #   run: ./gradlew --no-daemon publishToMavenCentral -PciVersion=${{ env.RELEASE_VERSION }}

      # CLI release assets: stripped native executables (linux x64/arm64 — the
      # host-linkable targets), the JVM dist zip, and SHA256SUMS.
      - name: Build CLI release assets
        run: ./gradlew --no-daemon :klause-cli:releaseAssets -PciVersion=${{ env.RELEASE_VERSION }}

      - name: Detect pre-release
        run: |
          if [[ "$RELEASE_VERSION" == *"-"* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.IS_PRERELEASE }}
          generate_release_notes: true
          files: klause-cli/build/release-assets/*
