name: arms-414 source witness checks
on:
  pull_request:
    paths:
      - 'klause-bench/campaigns/arms-414/**'
      - '.github/workflows/arms-414-source-check.yml'
  workflow_dispatch:
concurrency:
  group: arms-414-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-check:
    name: Check archived MiniZinc witnesses against source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Analyze archived campaign records
        run: |
          mapfile -t job_ids < <(find klause-bench/campaigns/arms-414/evidence -mindepth 2 -maxdepth 2 -name raw-records.json.gz -printf '%h\n' | sed 's|.*/||' | sort -n)
          python3 klause-bench/campaigns/arms-414/analyze.py "${job_ids[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arms-414-analysis
          path: |
            klause-bench/campaigns/arms-414/evidence/campaign-summary.json
            klause-bench/campaigns/arms-414/evidence/*/analysis.json.gz
            klause-bench/campaigns/arms-414/evidence/*/summary.json
            klause-bench/campaigns/arms-414/evidence/*/cases.csv
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Install pinned MiniZinc compiler
        run: |
          mkdir -p "$RUNNER_TEMP/minizinc"
          curl -fsSL https://github.com/MiniZinc/MiniZincIDE/releases/download/2.9.4/MiniZincIDE-2.9.4-bundle-linux-x86_64.tgz | tar -xz -C "$RUNNER_TEMP/minizinc" --strip-components=1
          echo "$RUNNER_TEMP/minizinc/bin" >> "$GITHUB_PATH"
      - name: Build source checker
        run: ./gradlew :klause-bench:installDist
      - name: Check archived source witnesses
        run: |
          minizinc --version > compiler-version.txt
          mapfile -t job_ids < <(python3 - <<'PY'
          import gzip, json
          from pathlib import Path
          for path in sorted(Path('klause-bench/campaigns/arms-414/evidence').glob('*/raw-records.json.gz')):
              records = json.loads(gzip.decompress(path.read_bytes()))
              if any(row.get('finalWitness') for row in records.values()):
                  print(path.parent.name)
          PY
          )
          if (( ${#job_ids[@]} )); then
            python3 klause-bench/campaigns/arms-414/check_witnesses.py --bench klause-bench/build/install/klause-bench/bin/klause-bench --output source-checks.json "${job_ids[@]}"
          else
            echo '[]' > source-checks.json
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arms-414-source-checks
          path: |
            source-checks.json
            compiler-version.txt
