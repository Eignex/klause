allprojects {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group != 'com.eignex') return
            switch (details.requested.name) {
                case 'koblas':
                    details.useVersion('0.1.1-20260910.200234-195')
                    break
                case 'koblas-jvm':
                    details.useVersion('0.1.1-20260910.200234-198')
                    break
                case 'koblas-hfactor':
                    details.useVersion('0.1.1-20260910.200234-95')
                    break
            }
        }
    }
}
