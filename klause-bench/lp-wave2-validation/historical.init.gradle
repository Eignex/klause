gradle.projectsEvaluated {
    def project = rootProject.project(':klause')
    def harnessRoot = System.getProperty('lpWave2.harnessRoot')
    if (harnessRoot == null) throw new GradleException('missing -DlpWave2.harnessRoot')
    project.kotlin.sourceSets.getByName('jvmTest').kotlin.setSrcDirs([
        new File(harnessRoot, 'klause/src/lpWave2Historical/kotlin')
    ])
    def compilation = project.kotlin.targets.getByName('jvm').compilations.getByName('test')
    project.tasks.register('lpWave2HistoricalAcceptance', JavaExec) {
        group = 'verification'
        description = 'Measure the Wave 1 rebind control for LP Wave 2 acceptance.'
        dependsOn(compilation.compileTaskProvider)
        classpath(compilation.output.allOutputs, compilation.runtimeDependencyFiles)
        mainClass.set('com.eignex.klause.lp.LpWave2HistoricalAcceptanceKt')
        workingDir(project.rootDir)
        systemProperty('lpWave2.harnessRoot', harnessRoot)
        systemProperty('klause.workspace.root', project.rootDir.absolutePath)
    }
}
